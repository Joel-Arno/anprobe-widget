<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schmuck-Prüfung</title>
<style>
  :root { --text: #1e1b18; --linie: #e8e1d6; --grund: #fbf8f3; }
  html, body { margin: 0; background: var(--grund); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #leiste { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; z-index: 2; background: rgba(251,248,243,.85); padding: 6px; border: 1px solid var(--linie); }
  #leiste.versteckt { display: none; }
  canvas { display: block; }
  #info { position: fixed; bottom: 8px; left: 8px; font-size: 12px; color: #6b6259; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="leiste">
  <select id="wahl"></select>
  <select id="ansicht"></select>
  <select id="metall"><option value="">Metall laut Spec</option><option>gold</option><option>silber</option><option>rosegold</option><option>weissgold</option></select>
  <select id="ton"><option value="aces">ACES</option><option value="agx">AgX</option></select>
</div>
<canvas id="leinwand"></canvas>
<div id="info"></div>
<script type="module" src="./pruefseite.js"></script>
</body>
</html>
