<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tracking-Prüfung</title>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}

<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block;max-width:100%}</style>

<body>
<canvas id="leinwand"></canvas>
<script type="module">
// Pruefseite: Tracker im Einzelbildmodus auf Testbildern, Debugzeichnung.
// window.__pruefe(fall) -> { png, info }
import * as THREE from 'three';
import { Tracker } from '/src/tracking/tracker.js';

const KONFIG = {
  mediapipe: '/node_modules/@mediapipe/tasks-vision',
  modelle: {
    hand: '/test/cache/modelle/hand_landmarker.task',
    gesicht: '/test/cache/modelle/face_landmarker.task',
    koerper: '/test/cache/modelle/pose_landmarker_lite.task'
  }
};
window.AnprobeKonfig = KONFIG;
const tracker = {};
async function holeTracker(art) {
  if (!tracker[art]) {
    tracker[art] = new Tracker(art, { konfig: KONFIG });
    await tracker[art].laden();
  }
  return tracker[art];
}

async function ladeBild(url) {
  const b = new Image();
  b.src = url;
  await b.decode();
  return b;
}

const ROT = '#ff3b30', GRUEN = '#34c759', BLAU = '#0a84ff';

/** Zeichenhilfe im Buehnenraum (Y oben) auf dem Canvas. */
function zeichner(ctx, W, H, spiegel, massstab) {
  const k = (p) => [p.x * massstab, (H - p.y) * massstab];
  return {
    k,
    punkt(p, r, farbe) {
      const [x, y] = k(p);
      ctx.fillStyle = farbe; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    },
    kreuz(p, r, farbe, breite = 2) {
      const [x, y] = k(p);
      ctx.strokeStyle = farbe; ctx.lineWidth = breite; ctx.beginPath();
      ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    },
    linie(a, b, farbe, breite = 1, strich = []) {
      const [x1, y1] = k(a), [x2, y2] = k(b);
      ctx.setLineDash(strich); ctx.strokeStyle = farbe; ctx.lineWidth = breite;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
    },
    polylinie(pts, farbe, breite = 1, zu = false, strich = []) {
      ctx.setLineDash(strich); ctx.strokeStyle = farbe; ctx.lineWidth = breite; ctx.beginPath();
      pts.forEach((p, i) => { const [x, y] = k(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      if (zu) ctx.closePath();
      ctx.stroke(); ctx.setLineDash([]);
    },
    text(p, t, farbe = '#fff') {
      const [x, y] = k(p);
      ctx.font = `${Math.max(11, 12 * massstab)}px sans-serif`;
      ctx.fillStyle = '#000'; ctx.fillText(t, x + 5, y - 3);
      ctx.fillStyle = farbe; ctx.fillText(t, x + 4, y - 4);
    }
  };
}

function achsen(z, anker, laengeMm) {
  const l = laengeMm * anker.pxProMm;
  const p = anker.position;
  const ex = new THREE.Vector3(1, 0, 0).applyQuaternion(anker.quaternion).multiplyScalar(l).add(p);
  const ey = new THREE.Vector3(0, 1, 0).applyQuaternion(anker.quaternion).multiplyScalar(l).add(p);
  const ez = new THREE.Vector3(0, 0, 1).applyQuaternion(anker.quaternion).multiplyScalar(l).add(p);
  z.linie(p, ex, ROT, 3); z.linie(p, ey, GRUEN, 3); z.linie(p, ez, BLAU, 3);
}

/** Kreis im lokalen X-Z-Rahmen eines Ankers (Ring/Armband), vorn durchgezogen, hinten gestrichelt. */
function schlaufe(z, anker, rx, rz, farbe) {
  const ax = new THREE.Vector3(1, 0, 0).applyQuaternion(anker.quaternion);
  const az = new THREE.Vector3(0, 0, 1).applyQuaternion(anker.quaternion);
  const vorn = [], hinten = [];
  for (let i = 0; i <= 64; i++) {
    const w = i / 64 * Math.PI * 2;
    const p = anker.position.clone().addScaledVector(ax, Math.cos(w) * rx).addScaledVector(az, Math.sin(w) * rz);
    const istVorn = p.z >= anker.position.z;
    (istVorn ? vorn : hinten).push(p);
    if (istVorn) hinten.push(null); else vorn.push(null);
  }
  const zeichneTeile = (liste, strich) => {
    let teil = [];
    for (const p of liste) {
      if (p) teil.push(p); else { if (teil.length > 1) z.polylinie(teil, farbe, 2, false, strich); teil = []; }
    }
    if (teil.length > 1) z.polylinie(teil, farbe, 2, false, strich);
  };
  zeichneTeile(hinten, [4, 4]);
  zeichneTeile(vorn, []);
}

function zeichneKapsel(z, a, b, r, farbe) {
  const d = new THREE.Vector3(b.x - a.x, b.y - a.y, 0);
  const l = d.length();
  const n = l > 1e-6 ? new THREE.Vector3(-d.y / l, d.x / l, 0) : new THREE.Vector3(1, 0, 0);
  const w0 = Math.atan2(n.y, n.x);
  const pts = [];
  for (let i = 0; i <= 16; i++) { const w = w0 + Math.PI * i / 16; pts.push(new THREE.Vector3(a.x + r * Math.cos(w), a.y + r * Math.sin(w), 0)); }
  for (let i = 0; i <= 16; i++) { const w = w0 + Math.PI + Math.PI * i / 16; pts.push(new THREE.Vector3(b.x + r * Math.cos(w), b.y + r * Math.sin(w), 0)); }
  z.polylinie(pts, farbe, 1, true);
}

function zeichneEllipsoid(z, e, farbe) {
  // Umriss der orthografischen Projektion: Punkte auf der Oberflaeche, deren Normale z = 0
  const R = new THREE.Matrix4().makeRotationFromQuaternion(e.quaternion);
  const A = new THREE.Matrix3().setFromMatrix4(R).multiply(new THREE.Matrix3().set(e.radien.x, 0, 0, 0, e.radien.y, 0, 0, 0, e.radien.z));
  const m = A.elements; // spaltenweise
  // S = P A A^T P^T (2x2)
  const r0 = [m[0], m[3], m[6]], r1 = [m[1], m[4], m[7]];
  const s00 = r0[0] * r0[0] + r0[1] * r0[1] + r0[2] * r0[2];
  const s01 = r0[0] * r1[0] + r0[1] * r1[1] + r0[2] * r1[2];
  const s11 = r1[0] * r1[0] + r1[1] * r1[1] + r1[2] * r1[2];
  const tr = s00 + s11, det = s00 * s11 - s01 * s01;
  const l1 = tr / 2 + Math.sqrt(Math.max(0, tr * tr / 4 - det)), l2 = tr / 2 - Math.sqrt(Math.max(0, tr * tr / 4 - det));
  const w = Math.abs(s01) > 1e-9 ? Math.atan2(l1 - s00, s01) : (s00 >= s11 ? 0 : Math.PI / 2);
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const t = i / 48 * Math.PI * 2;
    const x = Math.sqrt(l1) * Math.cos(t), y = Math.sqrt(Math.max(0, l2)) * Math.sin(t);
    pts.push(new THREE.Vector3(e.mitte.x + x * Math.cos(w) - y * Math.sin(w), e.mitte.y + x * Math.sin(w) + y * Math.cos(w), 0));
  }
  z.polylinie(pts, farbe, 1.5, true, [6, 4]);
}

function zeichneZylinder(z, c, farbe) {
  const achse = c.b.clone().sub(c.a).normalize();
  const tiefe = new THREE.Vector3().crossVectors(achse, c.quer).normalize();
  const ring = (m) => {
    const pts = [];
    for (let i = 0; i <= 32; i++) {
      const w = i / 32 * Math.PI * 2;
      pts.push(m.clone().addScaledVector(c.quer, Math.cos(w) * c.rQuer).addScaledVector(tiefe, Math.sin(w) * c.rTiefe));
    }
    return pts;
  };
  z.polylinie(ring(c.a), farbe, 1.5, true);
  z.polylinie(ring(c.b), farbe, 1.5, true);
  for (const s of [1, -1]) {
    z.linie(c.a.clone().addScaledVector(c.quer, s * c.rQuer), c.b.clone().addScaledVector(c.quer, s * c.rQuer), farbe, 1.5);
  }
}

function zeichneVerdecker(z, liste, farbe) {
  for (const v of liste) {
    if (v.typ === 'kapsel') zeichneKapsel(z, v.a, v.b, v.r, farbe);
    else if (v.typ === 'ellipsoid') zeichneEllipsoid(z, v, farbe);
    else if (v.typ === 'ellipsenzylinder') zeichneZylinder(z, v, farbe);
    else if (v.typ === 'netz') {
      const p = v.positionen, ix = v.index;
      const P = (i) => ({ x: p[i * 3], y: p[i * 3 + 1] });
      for (let i = 0; i < ix.length; i += 3) z.polylinie([P(ix[i]), P(ix[i + 1]), P(ix[i + 2])], 'rgba(255,255,255,0.18)', 0.5, true);
    }
  }
}

window.__pruefe = async (fall) => {
  const bild = await ladeBild('/test/cache/bilder/' + fall.bild);
  // Quelle: ganzes Bild oder Ausschnitt (crop: [x, y, w, h])
  const [cx, cy, cw, ch] = fall.crop || [0, 0, bild.naturalWidth, bild.naturalHeight];
  const quelle = document.createElement('canvas');
  quelle.width = cw; quelle.height = ch;
  quelle.getContext('2d').drawImage(bild, cx, cy, cw, ch, 0, 0, cw, ch);
  const W = cw, H = ch, spiegel = !!fall.spiegel;
  const t = await holeTracker(fall.art);
  const t0 = performance.now();
  const erg = t.verarbeite(quelle, null, { W, H, spiegel });
  const ms = performance.now() - t0;

  const massstab = fall.massstab || Math.min(2, 1100 / Math.max(W, H));
  const leinwand = document.getElementById('leinwand');
  leinwand.width = Math.round(W * massstab); leinwand.height = Math.round(H * massstab);
  const ctx = leinwand.getContext('2d');
  ctx.save();
  if (spiegel) { ctx.translate(leinwand.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(quelle, 0, 0, leinwand.width, leinwand.height);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, leinwand.width, leinwand.height);
  const z = zeichner(ctx, W, H, spiegel, massstab);

  if (fall.ohneVerdecker !== true) zeichneVerdecker(z, erg.verdecker, 'rgba(255,214,10,0.85)');
  const d = erg.debug || {};
  for (const p of d.punkte2d || []) if ((d.punkte2d || []).length < 100) z.punkt(p, 2, '#fff');
  for (const p of d.gesicht2d || []) z.punkt(p, 0.8, 'rgba(255,255,255,0.5)');

  const info = { gefunden: erg.gefunden, hinweis: erg.hinweis, ms: +ms.toFixed(1), masse: erg.masse, anker: {} };
  const A = erg.anker;
  if (A.ring) {
    for (const [f, a] of Object.entries(A.ring)) {
      const r = erg.masse.fingerRadiusPx[f];
      schlaufe(z, a, r, r, '#ffd60a');
      achsen(z, a, 12);
      info.anker[f] = { x: +a.position.x.toFixed(1), y: +a.position.y.toFixed(1), ppm: +a.pxProMm.toFixed(3), r: +r.toFixed(1) };
    }
  }
  if (A.armband) {
    const r = erg.masse.handgelenkRadienPx;
    schlaufe(z, A.armband, r.quer, r.tiefe, '#ffd60a');
    achsen(z, A.armband, 25);
    info.anker.armband = { x: +A.armband.position.x.toFixed(1), y: +A.armband.position.y.toFixed(1), ppm: +A.armband.pxProMm.toFixed(3) };
  }
  for (const k of ['ohrL', 'ohrR']) {
    const a = A[k];
    if (!a) continue;
    achsen(z, a, 15);
    z.punkt(a.position, 5, a.sichtbar > 0.5 ? '#ff2d55' : 'rgba(255,45,85,0.4)');
    z.text(a.position, `${k} ${a.sichtbar.toFixed(2)}`, '#ff2d55');
    info.anker[k] = { x: +a.position.x.toFixed(1), y: +(H - a.position.y).toFixed(1), sichtbar: +a.sichtbar.toFixed(2), ppm: +a.pxProMm.toFixed(3) };
  }
  if (A.kette) {
    const a = A.kette;
    achsen(z, a, 40);
    z.punkt(a.position, 6, '#ff2d55');
    // Hals-Querschnitt (Normhals, Mitte hinter der Drosselgrube)
    const rh = (erg.masse.halsRadiusMm || 55) * a.pxProMm;
    const mitte = { position: a.position.clone().add(new THREE.Vector3(0, 0, -rh).applyQuaternion(a.quaternion)), quaternion: a.quaternion, pxProMm: a.pxProMm };
    schlaufe(z, mitte, rh, rh, '#ffd60a');
    info.anker.kette = { x: +a.position.x.toFixed(1), y: +(H - a.position.y).toFixed(1), ppm: +a.pxProMm.toFixed(3), hals: erg.masse.halsRadiusMm };
  }
  // Soll-Punkte (Bildkoordinaten, Y unten)
  for (const g of fall.soll || []) {
    const p = { x: spiegel ? W - (g[0] - cx) : g[0] - cx, y: H - (g[1] - cy) };
    z.kreuz(p, 9, '#30d158', 2);
  }
  const zeilen = [
    `${fall.bild} ${fall.art}${spiegel ? ' gespiegelt' : ''}  gefunden=${erg.gefunden}  hinweis=${erg.hinweis ? erg.hinweis.code : '-'}`,
    Object.entries(d).filter(([k, v]) => typeof v !== 'object' || v === null).map(([k, v]) => `${k}=${typeof v === 'number' ? v.toFixed(2) : v}`).join('  ')
  ];
  ctx.font = '14px sans-serif';
  zeilen.forEach((t, i) => { ctx.fillStyle = '#000'; ctx.fillText(t, 9, 19 + i * 18); ctx.fillStyle = '#fff'; ctx.fillText(t, 8, 18 + i * 18); });
  info.debug = Object.fromEntries(Object.entries(d).filter(([k, v]) => typeof v !== 'object' || v === null));
  return { png: leinwand.toDataURL('image/png'), info, W, H };
};
// Rohe Landmarken einer (ggf. beschnittenen) Quelle, fuer Kalibrierskripte
window.__landmarken = async (fall) => {
  const bild = await ladeBild('/test/cache/bilder/' + fall.bild);
  const [cx, cy, cw, ch] = fall.crop || [0, 0, bild.naturalWidth, bild.naturalHeight];
  const quelle = document.createElement('canvas');
  quelle.width = cw; quelle.height = ch;
  quelle.getContext('2d').drawImage(bild, cx, cy, cw, ch, 0, 0, cw, ch);
  const t = await holeTracker(fall.art);
  const aus = { W: cw, H: ch, crop: [cx, cy, cw, ch] };
  for (const [q, e] of Object.entries(t.erkenner)) {
    if (q === 'mp') continue;
    aus[q] = JSON.parse(JSON.stringify(e.erkenne(quelle, null)));
  }
  return aus;
};
// Lupe fuer die Ringkalibrierung: Ausschnitt der Finger in hoher Vergroesserung,
// je Finger Linie MCP -> PIP mit Querstrichen bei 30..70 % (Laenge = Norm-
// Fingerdurchmesser * Massstab), dazu der aktuelle Ringanker (rot).
window.__lupe = async (fall) => {
  const bild = await ladeBild('/test/cache/bilder/' + fall.bild);
  const W = bild.naturalWidth, H = bild.naturalHeight;
  const t = await holeTracker('ring');
  const erg = t.verarbeite(bild, null, { W, H, spiegel: false });
  if (!erg.gefunden) return null;
  const P = erg.debug.punkte2d; // Buehne (Y oben)
  const xs = [], ys = [];
  for (const i of [1, 2, 3, 5, 6, 9, 10, 13, 14, 17, 18]) { xs.push(P[i].x); ys.push(H - P[i].y); }
  const rand = 0.15 * Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  const x0 = Math.max(0, Math.min(...xs) - rand), x1 = Math.min(W, Math.max(...xs) + rand);
  const y0 = Math.max(0, Math.min(...ys) - rand), y1 = Math.min(H, Math.max(...ys) + rand);
  const m = 1100 / Math.max(x1 - x0, y1 - y0);
  const c = document.createElement('canvas');
  c.width = Math.round((x1 - x0) * m); c.height = Math.round((y1 - y0) * m);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bild, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
  const k = (p) => [(p.x - x0) * m, (H - p.y - y0) * m];
  const ppm = erg.anker.ring.zeige.pxProMm;
  const NORM = { daumen: [2, 3, 21], zeige: [5, 6, 18], mittel: [9, 10, 18.5], ring: [13, 14, 17], klein: [17, 18, 15] };
  ctx.font = '13px sans-serif';
  for (const [name, [i, j, dmm]] of Object.entries(NORM)) {
    const a = k(P[i]), b = k(P[j]);
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    const nx = -dy / l, ny = dx / l;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    const halb = 0.5 * dmm * ppm * m;
    for (const s of [0.3, 0.4, 0.5, 0.6, 0.7]) {
      const px = a[0] + dx * s, py = a[1] + dy * s;
      ctx.strokeStyle = s === 0.5 ? 'rgba(0,255,255,0.9)' : 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.moveTo(px - nx * halb, py - ny * halb); ctx.lineTo(px + nx * halb, py + ny * halb); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(String(Math.round(s * 10)), px + nx * (halb + 4), py + ny * (halb + 4));
    }
    const r = erg.anker.ring[name].position;
    const [rx, ry] = k(r);
    ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(rx, ry, 4, 0, 7); ctx.fill();
  }
  return { png: c.toDataURL('image/png'), ppm, ausschnitt: [x0, y0, x1, y1], m };
};
// Lupe fuer die Ohrkalibrierung: Ausschnitt +-25 mm um den Soll-Punkt bzw.
// die Schaetzung, Soll (gruen), Schaetzung (rot), Konturpunkte (weiss).
window.__ohrlupe = async (fall) => {
  const bild = await ladeBild('/test/cache/bilder/' + fall.bild);
  const [cx, cy, cw, ch] = fall.crop || [0, 0, bild.naturalWidth, bild.naturalHeight];
  const quelle = document.createElement('canvas');
  quelle.width = cw; quelle.height = ch;
  quelle.getContext('2d').drawImage(bild, cx, cy, cw, ch, 0, 0, cw, ch);
  const W = cw, H = ch;
  const t = await holeTracker('ohrringe');
  const erg = t.verarbeite(quelle, null, { W, H, spiegel: false });
  if (!erg.gefunden) return [];
  const P = erg.debug.punkte2d;
  const aus = [];
  for (const seite of ['L', 'R']) {
    const a = erg.anker['ohr' + seite];
    const soll = fall.ohr && fall.ohr[seite];
    const zx = soll ? soll[0] - cx : a.position.x, zy = soll ? soll[1] - cy : H - a.position.y;
    const halb = 25 * a.pxProMm;
    const m = 520 / (2 * halb);
    const c = document.createElement('canvas');
    c.width = c.height = 520;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(quelle, zx - halb, zy - halb, 2 * halb, 2 * halb, 0, 0, 520, 520);
    const k = (x, y) => [(x - zx + halb) * m, (y - zy + halb) * m];
    ctx.font = '12px sans-serif';
    for (const i of [234, 93, 132, 127, 58, 172, 454, 323, 361, 356, 288, 397, 162, 389, 21, 251]) {
      const [x, y] = k(P[i].x, H - P[i].y);
      if (x < 0 || y < 0 || x > 520 || y > 520) continue;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
      ctx.fillText(String(i), x + 5, y - 4);
    }
    if (soll) {
      const [x, y] = k(soll[0] - cx, soll[1] - cy);
      ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
    }
    const [ex, ey] = k(a.position.x, H - a.position.y);
    ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, 7); ctx.fill();
    // 10-mm-Massstab
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, 505); ctx.lineTo(10 + 10 * a.pxProMm * m, 505); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText('10 mm', 12, 498);
    aus.push({ seite, png: c.toDataURL('image/png'), ppm: a.pxProMm });
  }
  return aus;
};
// Lupe fuer Ketten: Ausschnitt um die Drosselgrube, eine 45-cm-Kette auf dem
// Normkoerper (src/schmuck/kette.js, nur zur Anschauung) wie von der Buehne
// gesetzt (X/Z nach halsRadiusMm/55), vorn durchgezogen, hinten gepunktet.
window.__kettelupe = async (fall) => {
  const { drapiereKette } = await import('/src/schmuck/kette.js');
  const bild = await ladeBild('/test/cache/bilder/' + fall.bild);
  const [cx, cy, cw, ch] = fall.crop || [0, 0, bild.naturalWidth, bild.naturalHeight];
  const quelle = document.createElement('canvas');
  quelle.width = cw; quelle.height = ch;
  quelle.getContext('2d').drawImage(bild, cx, cy, cw, ch, 0, 0, cw, ch);
  const W = cw, H = ch, spiegel = !!fall.spiegel;
  const t = await holeTracker('kette');
  const erg = t.verarbeite(quelle, null, { W, H, spiegel });
  const a = erg.anker.kette;
  if (!a) return null;
  const ppm = a.pxProMm;
  const halb = (fall.halbMm || 140) * ppm;
  const zx = a.position.x, zy = H - a.position.y + 0.3 * halb;
  const m = 700 / (2 * halb);
  const c = document.createElement('canvas');
  c.width = c.height = 700;
  const ctx = c.getContext('2d');
  ctx.save();
  if (spiegel) { ctx.translate(700, 0); ctx.scale(-1, 1); }
  const qx = spiegel ? W - zx : zx;
  ctx.drawImage(quelle, qx - halb, zy - halb, 2 * halb, 2 * halb, 0, 0, 700, 700);
  ctx.restore();
  const k = (p) => [(p.x - zx + halb) * m, (H - p.y - zy + halb) * m];
  const sk = Math.min(1.25, Math.max(0.8, (erg.masse.halsRadiusMm || 55) / 55));
  for (const laenge of fall.laengen || [420, 500]) {
    const dr = drapiereKette(laenge, {});
    dr.punkte.forEach((p, i) => {
      const lokal = new THREE.Vector3(p.x * sk, p.y, p.z * sk).multiplyScalar(ppm);
      const w = lokal.applyQuaternion(a.quaternion).add(a.position);
      const vorn = dr.normalen[i].z > -0.2;
      const [x, y] = k(w);
      ctx.fillStyle = vorn ? '#ffd60a' : 'rgba(255,214,10,0.35)';
      ctx.fillRect(x - (vorn ? 1.5 : 0.8), y - (vorn ? 1.5 : 0.8), vorn ? 3 : 1.6, vorn ? 3 : 1.6);
    });
  }
  // Achsen, Drosselgrube
  const L = 30 * ppm;
  for (const [v, f] of [[new THREE.Vector3(1, 0, 0), '#ff3b30'], [new THREE.Vector3(0, 1, 0), '#34c759'], [new THREE.Vector3(0, 0, 1), '#0a84ff']]) {
    const e = v.applyQuaternion(a.quaternion).multiplyScalar(L).add(a.position);
    ctx.strokeStyle = f; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...k(a.position)); ctx.lineTo(...k(e)); ctx.stroke();
  }
  const [dx, dy] = k(a.position);
  ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(dx, dy, 5, 0, 7); ctx.fill();
  if (fall.drossel) {
    const p = { x: spiegel ? W - (fall.drossel[0] - cx) : fall.drossel[0] - cx, y: H - (fall.drossel[1] - cy) };
    const [x, y] = k(p);
    ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
  }
  // Schulterpunkte der Pose
  const P = erg.debug.punkte2d || [];
  for (const i of [11, 12]) if (P[i]) { const [x, y] = k(P[i]); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif';
  ctx.fillText(`ppm ${ppm.toFixed(3)}  Hals ${(erg.masse.halsRadiusMm || 0).toFixed(1)} mm  Schulter ${(erg.debug.schulterMm || 0).toFixed(0)} mm`, 8, 690);
  return { png: c.toDataURL('image/png') };
};
window.__bereit = true;
</script>
